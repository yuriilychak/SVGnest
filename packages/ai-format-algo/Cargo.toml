[package]
name = "ai-format-algo"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM Adobe Illustrator format detection and conversion core for SVGnest."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
effectcraft-pdf = "0.9.2"
illustrator-rs = { path = "../illustrator-rs", features = ["parser", "export", "importer", "writer"] }
kurbo = "0.13"
svg-format-algo = { path = "../svg-format-algo", default-features = false }
zpdf = { version = "0.21.0", default-features = false }
zpdf-svg-export = "0.21.0"
# zpdf's optional PDF encryption support reaches getrandom on wasm; enable
# its browser backend so the complete parser remains wasm32-compatible.
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
