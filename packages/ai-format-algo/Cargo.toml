[package]
name = "ai-format-algo"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM Adobe Illustrator format detection and conversion core for SVGnest."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
illustrator-rs = { path = "../illustrator-rs", features = ["importer", "writer"] }
svg-format-algo = { path = "../svg-format-algo", default-features = false }
zpdf = { version = "0.21.0", default-features = false }
zpdf-svg-export = "0.21.0"
# zpdf's transitive encryption support reaches getrandom on wasm; enable its
# browser backend for the PDF-only parser build.
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
